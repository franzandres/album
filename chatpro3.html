<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatPro Premium | Mensajería Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        secondary: '#1e293b',
                        success: '#10b981',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                        light: '#f8fafc'
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto { content-visibility: auto; }
            .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
            .scrollbar-hide::-webkit-scrollbar { display: none; }
            .chat-bubble-send { border-radius: 18px 4px 18px 18px; }
            .chat-bubble-receive { border-radius: 4px 18px 18px 18px; }
            .video-controls-custom { opacity: 0; transition: opacity 0.3s; }
            .video-container:hover .video-controls-custom { opacity: 1; }
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans">
    <!-- Contenedor Principal -->
    <div class="flex h-screen overflow-hidden">
        
        <!-- Barra Lateral Izquierda -->
        <aside class="w-full md:w-1/4 lg:w-1/5 bg-white border-r border-gray-200 flex flex-col">
            <div class="p-4 border-b border-gray-200 bg-primary text-white">
                <h1 class="text-xl font-bold flex items-center justify-between">
                    <span><i class="fa fa-comments mr-2"></i> ChatPro</span>
                    <span id="notif-icon" class="relative cursor-pointer">
                        <i class="fa fa-bell"></i>
                        <span id="notif-count" class="absolute -top-2 -right-2 bg-danger text-white text-xs w-5 h-5 flex items-center justify-center rounded-full animate-pulse hidden">3</span>
                    </span>
                </h1>
                <div class="mt-2 text-sm opacity-90">
                    <span id="online-users">? 1,482 Usuarios en línea</span>
                </div>
                <div class="mt-1 text-xs">
                    <span id="total-contacts">?? +1,000,000 Contactos disponibles</span>
                </div>
                <!-- Botón Crear Grupo -->
                <button id="create-group-btn" class="mt-2 w-full bg-warning/90 hover:bg-warning text-white text-sm py-1.5 rounded flex items-center justify-center gap-1 transition">
                    <i class="fa fa-users"></i> Crear Sala / Grupo
                </button>
            </div>

            <!-- Buscador -->
            <div class="p-3 relative">
                <input type="text" id="search-contacts" placeholder="Buscar contactos o grupos..." 
                    class="w-full px-4 py-2 pl-10 rounded-full bg-gray-100 border-none focus:ring-2 focus:ring-primary/50">
                <i class="fa fa-search absolute left-6 top-1/2 -translate-y-1/2 text-gray-500"></i>
            </div>

            <!-- Salas / Grupos -->
            <div class="px-3 pb-2">
                <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Tus Salas</h3>
                <div id="groups-list" class="mt-1 space-y-1">
                    <div class="p-2 bg-primary/10 rounded-lg cursor-pointer hover:bg-primary/20 transition">
                        <p class="font-medium text-sm">?? Sala General Global</p>
                        <p class="text-xs text-gray-600">+1.2k miembros activos</p>
                    </div>
                    <div class="p-2 bg-green-50 rounded-lg cursor-pointer hover:bg-green-100 transition">
                        <p class="font-medium text-sm">?? Equipo de Trabajo</p>
                        <p class="text-xs text-gray-600">34 miembros</p>
                    </div>
                </div>
            </div>
            <hr class="mx-2 border-gray-200">

            <!-- Lista de Contactos (+1 Millón) -->
            <div id="contacts-list" class="flex-1 overflow-y-auto scrollbar-hide p-2"></div>

            <!-- Botón Agregar Contacto -->
            <div class="p-3 border-t border-gray-200">
                <button id="add-contact-btn" class="w-full bg-success hover:bg-success/90 text-white py-2 rounded-lg flex items-center justify-center gap-2 transition">
                    <i class="fa fa-user-plus"></i> Agregar Nuevo Contacto
                </button>
            </div>
        </aside>

        <!-- Sección Central: Chat Principal -->
        <main class="hidden md:flex md:w-3/4 lg:w-4/5 flex-col bg-gray-50">
            <header class="px-6 py-3 bg-white border-b border-gray-200 flex justify-between items-center shadow-sm">
                <div class="flex items-center gap-3">
                    <div class="relative">
                        <img src="https://picsum.photos/id/64/200/200" alt="Grupo" class="w-10 h-10 rounded-full object-cover border-2 border-green-500">
                        <span class="absolute -top-1 -right-1 bg-green-500 w-3 h-3 rounded-full border border-white"></span>
                    </div>
                    <div>
                        <h2 class="font-semibold text-gray-800">?? Sala General Global</h2>
                        <p class="text-xs text-gray-500">Todos conectados • En línea ahora</p>
                    </div>
                </div>
                <div class="flex gap-3">
                    <button class="p-2 rounded-full hover:bg-gray-100 transition" title="Videollamada grupal">
                        <i class="fa fa-video-camera text-gray-600 text-lg"></i>
                    </button>
                    <button class="p-2 rounded-full hover:bg-gray-100 transition" title="Ajustes de sala">
                        <i class="fa fa-cog text-gray-600 text-lg"></i>
                    </button>
                </div>
            </header>

            <!-- Área de Mensajes -->
            <div id="messages-container" class="flex-1 overflow-y-auto p-6 space-y-4 bg-[url('https://picsum.photos/id/1015/1920/1080')] bg-cover bg-fixed bg-opacity-10"></div>

            <!-- Área para Compartir y Escribir -->
            <div class="p-4 bg-white border-t border-gray-200 shadow-inner">
                <div class="flex items-center gap-2 mb-3 px-2">
                    <button class="text-gray-600 hover:text-primary transition p-2 rounded-full hover:bg-gray-100" title="Enviar Foto">
                        <i class="fa fa-file-image-o text-xl"></i>
                    </button>
                    <button id="send-video-btn" class="text-gray-600 hover:text-primary transition p-2 rounded-full hover:bg-gray-100" title="Enviar Video con controles">
                        <i class="fa fa-video-camera text-xl"></i>
                    </button>
                    <button class="text-gray-600 hover:text-primary transition p-2 rounded-full hover:bg-gray-100" title="Enviar Archivo">
                        <i class="fa fa-paperclip text-xl"></i>
                    </button>
                    <button class="text-gray-600 hover:text-primary transition p-2 rounded-full hover:bg-gray-100" title="Galería de Videos">
                        <i class="fa fa-play-circle text-xl"></i>
                    </button>
                </div>
                <div class="flex gap-2 items-center">
                    <input type="text" id="message-input" placeholder="Escribe tu mensaje, video o imagen aquí..." 
                        class="flex-1 px-5 py-3 rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition">
                    <button id="send-btn" class="bg-primary hover:bg-primary/90 text-white w-11 h-11 rounded-full flex items-center justify-center transition-transform hover:scale-105">
                        <i class="fa fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </main>

        <!-- Vista móvil -->
        <div id="mobile-chat-view" class="fixed inset-0 bg-white z-50 hidden md:hidden">
            <div class="p-3 border-b flex items-center">
                <button id="back-to-contacts" class="mr-3 text-xl"><i class="fa fa-arrow-left"></i></button>
                <h3 class="font-bold">Chat</h3>
            </div>
            <div id="mobile-messages" class="h-[calc(100vh-140px)] overflow-y-auto p-4"></div>
            <div class="p-3 border-t">
                <div class="flex gap-2">
                    <input type="text" placeholder="Escribe..." class="flex-1 border rounded-full px-4 py-2">
                    <button class="bg-primary text-white rounded-full w-10 h-10 flex items-center justify-center"><i class="fa fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Crear Grupo -->
    <div id="group-modal" class="fixed inset-0 bg-black/50 z-40 hidden items-center justify-center">
        <div class="bg-white rounded-lg p-6 w-[90%] max-w-md shadow-xl">
            <h3 class="text-xl font-bold mb-4">Crear Nueva Sala / Grupo</h3>
            <input type="text" id="group-name" placeholder="Nombre de la sala" class="w-full border p-2 rounded mb-3">
            <textarea id="group-description" placeholder="Descripción (opcional)" class="w-full border p-2 rounded mb-4" rows="3"></textarea>
            <div class="flex justify-end gap-2">
                <button id="close-modal" class="px-4 py-2 border rounded">Cancelar</button>
                <button id="save-group" class="px-4 py-2 bg-primary text-white rounded">Crear Sala</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const contactsList = document.getElementById('contacts-list');
            const messagesContainer = document.getElementById('messages-container');
            const messageInput = document.getElementById('message-input');
            const sendBtn = document.getElementById('send-btn');
            const searchInput = document.getElementById('search-contacts');
            const notifIcon = document.getElementById('notif-icon');
            const notifCount = document.getElementById('notif-count');
            const createGroupBtn = document.getElementById('create-group-btn');
            const groupModal = document.getElementById('group-modal');
            const closeModal = document.getElementById('close-modal');
            const saveGroup = document.getElementById('save-group');
            const sendVideoBtn = document.getElementById('send-video-btn');

            // ==== SIMULACIÓN: +1 MILLÓN DE CONTACTOS ====
            const totalContacts = 1000000;
            const batchSize = 50;
            let loadedCount = 0;
            const nombres = ["Carlos", "Ana", "Luis", "María", "Pedro", "Sofía", "Juan", "Lucía", "Miguel", "Elena", "Javier", "Carmen", "José", "Rosa", "Antonio", "Isabel"];
            const apellidos = ["Gómez", "Rodríguez", "López", "Martínez", "García", "Fernández", "Pérez", "Sánchez", "Ramírez", "Torres", "Díaz", "Vargas", "Ruiz", "Moreno"];

            function crearContacto(id) {
                const nombreAleatorio = nombres[Math.floor(Math.random() * nombres.length)];
                const apellidoAleatorio = apellidos[Math.floor(Math.random() * apellidos.length)];
                const estaEnLinea = Math.random() > 0.4;
                const ultimoMensaje = ["Hola! ??", "¿Viste este video? ??", "Archivo enviado ??", "Genial, gracias!", "Te llamo luego"][Math.floor(Math.random() * 5)];
                const contacto = document.createElement('div');
                contacto.className = `p-2 mb-1 rounded-lg hover:bg-primary/5 cursor-pointer transition ${estaEnLinea ? 'bg-green-50/40' : ''}`;
                contacto.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="relative">
                            <img src="https://picsum.photos/id/${(id % 50) + 1}/150/150" class="w-10 h-10 rounded-full object-cover">
                            ${estaEnLinea ? '<span class="absolute -top-0.5 -right-0.5 w-2.5 h-2.5 bg-green-500 rounded-full border border-white"></span>' : ''}
                        </div>
                        <div class="flex-1 min-w-0">
                            <h4 class="font-medium text-gray-800 text-sm truncate">${nombreAleatorio} ${apellidoAleatorio}</h4>
                            <p class="text-xs text-gray-500 truncate">${ultimoMensaje}</p>
                        </div>
                    </div>
                `;
                return contacto;
            }

            function cargarMasContactos() {
                if (loadedCount >= totalContacts) return;
                const cargarHasta = Math.min(loadedCount + batchSize, totalContacts);
                const fragmento = document.createDocumentFragment();
                for (let i = loadedCount; i < cargarHasta; i++) fragmento.appendChild(crearContacto(i));
                contactsList.appendChild(fragmento);
                loadedCount = cargarHasta;
            }
            cargarMasContactos(); cargarMasContactos();
            contactsList.addEventListener('scroll', () => {
                if (contactsList.scrollTop + contactsList.clientHeight >= contactsList.scrollHeight - 200) setTimeout(cargarMasContactos, 10);
            });

            // ==== SISTEMA DE NOTIFICACIONES ====
            function mostrarNotificacion(titulo, cuerpo) {
                if (!("Notification" in window)) return;
                if (Notification.permission === "granted") new Notification(titulo, {body: cuerpo, icon: 'https://picsum.photos/id/64/100/100'});
                else if (Notification.permission !== "denied") Notification.requestPermission().then(perm => { if (perm === "granted") new Notification(titulo, {body: cuerpo}); });
                notifCount.classList.remove('hidden');
                let actual = parseInt(notifCount.textContent); notifCount.textContent = actual + 1;
            }
            notifIcon.addEventListener('click', () => { notifCount.classList.add('hidden'); notifCount.textContent = '0'; });

            // ==== MENSAJES Y VIDEOS CON CONTROLES ====
            function agregarMensaje(texto, enviadoUsuario = true, adjunto = null) {
                const msgDiv = document.createElement('div');
                msgDiv.className = `flex ${enviadoUsuario ? 'justify-end' : 'justify-start'} mb-4`;
                let contenidoAdjunto = '';
                if (adjunto) {
                    if (adjunto.tipo === 'video') {
                        contenidoAdjunto = `
                        <div class="video-container relative mt-2 rounded-lg overflow-hidden shadow-md max-w-xs md:max-w-sm">
                            <video controls controlsList="nodownload" class="w-full rounded-lg" src="${adjunto.url}" poster="https://picsum.photos/id/1026/800/450">
                                Tu navegador no soporta video.
                            </video>
                            <div class="video-controls-custom absolute bottom-2 right-2 flex gap-1 bg-black/40 p-1 rounded">
                                <button onclick="this.closest('div').previousElementSibling.play()" class="text-white text-xs p-1"><i class="fa fa-play"></i></button>
                                <button onclick="this.closest('div').previousElementSibling.pause()" class="text-white text-xs p-1"><i class="fa fa-pause"></i></button>
                                <button onclick="let v=this.closest('div').previousElementSibling; v.volume = Math.min(1, v.volume+0.2);" class="text-white text-xs p-1"><i class="fa fa-volume-up"></i></button>
                            </div>
                        </div>`;
                    } else if (adjunto.tipo === 'imagen') {
                        contenidoAdjunto = `<img src="${adjunto.url}" class="max-w-xs md:max-w-sm rounded-lg mt-2 shadow-sm hover:scale-[1.02] transition-transform" alt="Imagen compartida">`;
                    }
                }
                msgDiv.innerHTML = `
                    <div class="max-w-[75%] md:max-w-[65%] px-4 py-3 shadow-sm ${
                        enviadoUsuario ? 'bg-primary text-white chat-bubble-send' : 'bg-white border border-gray-200 chat-bubble-receive'
                    }">
                        ${texto ? `<p class="text-sm">${texto.replace(/\n/g, '<br>')}</p>` : ''}
                        ${contenidoAdjunto}
                        <span class="text-[10px] mt-1 block text-right opacity-80">
                            ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} ??
                        </span>
                    </div>
                `;
                messagesContainer.appendChild(msgDiv);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
                if (!enviadoUsuario) mostrarNotificacion('?? Nuevo mensaje', texto || 'Te envió un archivo/video');
            }

            // ==== ACCIONES ====
            sendBtn.addEventListener('click', () => {
                const texto = messageInput.value.trim();
                if (!texto) return;
                agregarMensaje(texto, true); messageInput.value = '';
                setTimeout(() => {
                    const respuestas = ['¡Genial!', 'Mira este video ??', 'Entendido ?', '¡Qué bueno!', 'Gracias por compartir'];
                    agregarMensaje(respuestas[Math.floor(Math.random() * respuestas.length)], false);
                }, 1200);
            });
            messageInput.addEventListener('keypress', e => e.key === 'Enter' && sendBtn.click());

            sendVideoBtn.addEventListener('click', () => {
                agregarMensaje('Aquí tienes un video con controles avanzados ??', true, {tipo: 'video', url: 'https://www.w3schools.com/html/mov_bbb.mp4'});
            });

            // ==== CREAR GRUPOS / SALAS ====
            createGroupBtn.addEventListener('click', () => groupModal.classList.replace('hidden', 'flex'));
            closeModal.addEventListener('click', () => groupModal.classList.replace('flex', 'hidden'));
            saveGroup.addEventListener('click', () => {
                const nombre = document.getElementById('group-name').value.trim();
                if (!nombre) return alert('Escribe un nombre para la sala');
                const nuevoGrupo = document.createElement('div');
                nuevoGrupo.className = "p-2 bg-blue-50 rounded-lg cursor-pointer hover:bg-blue-100 transition mt-1";
                nuevoGrupo.innerHTML = `<p class="font-medium text-sm">?? ${nombre}</p><p class="text-xs text-gray-600">0 miembros • Agregar ahora</p>`;
                document.getElementById('groups-list').appendChild(nuevoGrupo);
                groupModal.classList.replace('flex', 'hidden');
                mostrarNotificacion('? Sala creada', `Tu sala "${nombre}" está lista`);
            });

            // Búsqueda
            searchInput.addEventListener('input', e => {
                const busq = e.target.value.toLowerCase().trim();
                contactsList.querySelectorAll('.p-2').forEach(div => {
                    const nom = div.querySelector('h4').textContent.toLowerCase();
