<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fiesta Cerveza y Poco Más - Página Principal</title>
<style>
  /* Estilos generales del cuerpo de la página */
  body {
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* Fuente moderna y legible */
    background-image: url('images/tu-imagen-fondo.jpg'); /* <<< REEMPLAZA ESTO CON LA RUTA CORRECTA A TU IMAGEN >>> */
    background-size: cover; /* La imagen de fondo cubrirá todo el espacio */
    background-position: center; /* Centra la imagen de fondo */
    background-attachment: fixed; /* Fija la imagen de fondo al hacer scroll */
    color: #ffffff; /* Color de texto blanco por defecto para que resalte en fondos oscuros */
    line-height: 1.6; /* Espaciado entre líneas para mejor lectura */
    scroll-behavior: smooth; /* Desplazamiento suave al hacer clic en enlaces de navegación */
  }

  /* Contenedor principal para centrar el contenido y darle un fondo semitransparente */
  .contenedor-contenido {
    max-width: 1000px; /* Ancho máximo del contenido */
    margin: 50px auto; /* Centra el contenedor y añade espacio arriba/abajo */
    padding: 40px;
    background-color: rgba(0, 0, 0, 0.6); /* Fondo semitransparente negro para el contenido */
    border-radius: 15px; /* Bordes redondeados */
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3); /* Sombra para dar profundidad */
    text-align: center; /* Centra el texto dentro del contenedor */
  }

  /* Estilos para el encabezado */
  header {
    background-color: rgba(0, 0, 0, 0.7); /* Fondo oscuro semitransparente para el encabezado */
    padding: 15px 0;
    position: sticky; /* Hace que el encabezado se quede fijo al hacer scroll */
    top: 0;
    z-index: 1000; /* Asegura que esté por encima de otros elementos */
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
  }
  nav {
    display: flex;
    justify-content: center; /* Centra los enlaces de navegación */
    align-items: center;
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 20px;
  }
  nav a {
    color: #ffffff;
    text-decoration: none;
    margin: 0 15px;
    font-size: 1.1em;
    font-weight: bold;
    transition: color 0.3s ease;
  }
  nav a:hover {
    color: #FFD700; /* Color dorado al pasar el ratón */
  }

  /* Estilos para el título principal (el de la imagen) */
  .titulo-principal {
    font-size: 3.5em; /* Tamaño grande para el título */
    margin-bottom: 20px;
    color: transparent; /* Hace el texto transparente para usar el gradiente de la imagen */
    -webkit-background-clip: text; /* Para navegadores WebKit (Chrome, Safari) */
    background-clip: text; /* Estándar */
    background-image: linear-gradient(45deg, #ff00ff, #ffff00, #00ffff); /* Gradiente similar al de la imagen */
    text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7); /* Sombra de texto para realzar */
    font-weight: bold;
  }

  /* Estilos para el subtítulo */
  .subtitulo {
    font-size: 1.8em; /* Tamaño para el subtítulo */
    color: #ffffff; /* Texto blanco para el subtítulo */
    margin-bottom: 30px;
    text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.5);
  }

  /* Estilos para el texto descriptivo */
  .texto-descriptivo {
    font-size: 1.1em;
    margin-bottom: 25px;
    text-align: justify; /* Justifica el texto para una apariencia más profesional */
  }

  /* Estilos para la sección de fotos */
  .seccion-fotos {
    margin-top: 50px;
  }
  .seccion-fotos h2 {
    font-size: 2em;
    color: #FFD700; /* Color dorado para el título de la sección de fotos */
    margin-bottom: 30px;
    border-bottom: 2px solid #FFD700;
    padding-bottom: 10px;
  }
  .galeria-fotos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); /* Diseño responsive para las fotos */
    gap: 20px; /* Espacio entre fotos */
  }
  .foto-item {
    background-color: rgba(255, 255, 255, 0.1); /* Fondo sutil para cada foto */
    border-radius: 10px;
    overflow: hidden; /* Para que las esquinas redondeadas funcionen */
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    transition: transform 0.3s ease;
  }
  .foto-item:hover {
    transform: scale(1.03); /* Efecto de zoom leve al pasar el ratón */
  }
  .foto-item img {
    width: 100%;
    height: 250px; /* Altura fija para las imágenes */
    object-fit: cover; /* Asegura que la imagen cubra el área sin distorsionarse */
    display: block; /* Elimina espacio extra debajo de la imagen */
  }
  .foto-item p {
    padding: 15px;
    font-size: 1em;
    margin: 0;
    color: #eee; /* Texto más claro para descripciones de fotos */
  }

  /* Estilos para el pie de página */
  footer {
    text-align: center;
    padding: 20px;
    margin-top: 40px;
    background-color: rgba(0, 0, 0, 0.7); /* Fondo oscuro para el pie de página */
    color: #ccc; /* Color de texto más claro para el pie de página */
    font-size: 0.9em;
  }

  /* Estilos para hacer la página responsive (adaptable a móviles) */
  @media (max-width: 768px) {
    .contenedor-contenido {
      margin: 30px 15px; /* Menos margen en pantallas pequeñas */
